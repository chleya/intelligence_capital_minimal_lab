seed: 42
n_seeds: 10
n_train_states: 1200
n_val_states: 200
n_test_id_states: 200
n_ood_states: 300

horizons: [1, 3, 5]
state_dim: 2
hidden_mode_dim: 1
mode_flip_prob: 0.08
autonomous_drift: 0.05
autonomous_noise: 0.1
action_gain: 0.25
action_noise: 0.05
action_sign_flip: true

epochs: 200
batch_size: 64
lr: 0.001
weight_decay: 0.00001
scheduler_patience: 20
early_stop_patience: 40

bottleneck_dim: 16
residual_dim: 8
history_len: 8
raw_memory_k: 5

ood_types:
  - background_drift_change
  - action_gain_change
  - action_sign_reversal

output_dir: results